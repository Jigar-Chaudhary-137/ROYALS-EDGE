services:
  - type: web
    name: royal-scout
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && npm run build
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.11.0

